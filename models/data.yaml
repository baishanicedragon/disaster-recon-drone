# dataset/data.yaml —— YOLO 数据集配置（示例）
#
# ⚠ 本文件只是**格式示例**：路径、类别、划分都要按你的实际数据集改。
# ⚠ 本仓库**不包含任何训练影像**，尤其不包含真实灾区影像（见下方伦理红线）。
#
# 使用：
#   yolo detect train model=yolov8n.pt data=data.yaml imgsz=640 epochs=200 batch=16
#   yolo detect val   model=runs/detect/train/weights/best.pt data=data.yaml

# --- 路径（相对本文件，或改绝对路径） ---
path: ../dataset
train: images/train
val:   images/val
# test: images/test      # 可选

# --- 类别（顺序即 ID，必须与机端推理固件一致） ---
# 见 docs/09 9.3.2 与 firmware/vision/README.md
names:
  0: person        # 人体（站立 / 俯卧 / 部分掩埋）   ← 最高优先级
  1: vehicle       # 车辆、工程机械
  2: structure     # 建筑残骸、屋顶
  3: cross_red     # 回收场红布十字标（迫降精定位用）
  4: debris        # 大型堆积物

nc: 5

# ============================================================
# 伦理红线（**必须遵守**）
# ============================================================
# 本仓库不使用、不收集、不分发任何真实灾区影像，尤其涉及遇难者的影像。
# 训练数据只能来自：
#   1) 公开数据集（COCO / VisDrone / DOTA 中的 person、car、truck 等类）；
#   2) **自建数据**：在本地相似环境（河滩、工地、山地道路）自行采集 + 人工标注；
#   3) 合成增强。
# ============================================================

# --- 数据采集与增强要点（详见 ../train/README.md） ---
# 采集：250 m AGL 高度、6.5 cm GSD、盘旋拍摄（与真实任务一致）
# 增强：泥灰色系 HSV 扰动、随机遮挡（模拟掩埋）、低对比度、随机旋转
# 小目标：mosaic=1.0；输入分辨率不要低于 640（算力允许时）
